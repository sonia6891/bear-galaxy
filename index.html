<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- added to a phone's home screen it opens on the whole screen, like an app (the only way on an iPhone) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="黑熊大冒險">
  <meta name="theme-color" content="#0d0f26">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <!-- what Facebook / LINE show when the link is shared -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sonia6891.github.io/bear-galaxy/">
  <meta property="og:title" content="黑熊大冒險">
  <meta property="og:description" content="在圓滾滾的小星球間跳躍，收集音符，打倒大魔王！打開網頁就能玩，手機也可以。">
  <meta property="og:image" content="https://sonia6891.github.io/bear-galaxy/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="description" content="在圓滾滾的小星球間跳躍，收集音符，打倒大魔王！打開網頁就能玩，手機也可以。">
  <title>黑熊大冒險</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0d0f26; }
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; /* the visible window, also on a phone whose bars come and go */ background: #0d0f26; outline: none;
      touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; } /* fingers play, they don't scroll or zoom */
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #ffe8a8; font-family: "Noto Serif TC", "PingFang TC", "Microsoft JhengHei", serif; gap: 18px; }
    #loading h1 { margin: 0; font-size: clamp(24px, 4vw, 44px); letter-spacing: .08em; text-shadow: 0 3px 10px #000; }
    #bar { width: min(420px, 70vw); height: 12px; border-radius: 6px; background: #2a2d55; overflow: hidden; border: 1px solid #c9a24a; }
    #fill { width: 0; height: 100%; background: linear-gradient(90deg, #ffd25a, #ff9d5a); }
    #note { font-size: 14px; color: #b9bde0; }
    #pct { font-size: 18px; color: #ffd25a; margin-top: -8px; }
    #note .tip { margin-top: 16px; color: #ffd25a; font-size: 15px; line-height: 1.7; text-align: left; display: table; margin-left: auto; margin-right: auto; } /* its own block under the loading line, centred, the steps aligned left */
    #note .tip b { display: block; font-size: 17px; margin-bottom: 4px; }
    /* a phone held upright: ask for it sideways (the game is laid out for a wide screen) */
    #turn { display: none; position: fixed; inset: 0; z-index: 10; background: rgba(13, 15, 38, .94); color: #ffe8a8;
      font-family: "Noto Serif TC", "PingFang TC", "Microsoft JhengHei", serif; font-size: 22px; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; text-align: center; }
    #turn b { font-size: 54px; }
    @media (orientation: portrait) and (pointer: coarse) { #turn { display: flex; } }
    /* the card that sends players out of Facebook's / LINE's own browser */
    #outside { display: none; position: fixed; inset: 0; z-index: 20; background: rgba(13, 15, 38, .96); color: #ffe8a8;
      font-family: "Noto Serif TC", "PingFang TC", "Microsoft JhengHei", serif; font-size: 20px; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 0 24px; }
    #outside b { font-size: 56px; }
    #outside a { background: linear-gradient(#ffd25a, #ff9d5a); color: #3c190a; font-size: 24px; font-weight: bold;
      padding: 14px 34px; border-radius: 40px; text-decoration: none; }
    #outside .small { font-size: 15px; color: #b9bde0; }
    #outside button { background: none; border: 1px solid #6a6fa8; color: #b9bde0; font-size: 15px; padding: 8px 20px; border-radius: 20px; }
    #share { display: none; position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 15; border: 3px solid #fff;
      background: linear-gradient(#ffd25a, #ff9d5a); color: #3c190a; font-size: 22px; font-weight: bold; padding: 12px 34px;
      border-radius: 32px; box-shadow: 0 4px 14px rgba(0, 0, 0, .45); font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
    #toast { display: none; position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%); z-index: 16; background: rgba(13, 15, 38, .92);
      color: #ffe8a8; padding: 10px 18px; border-radius: 12px; font-size: 16px; }
  </style>
</head>
<body>
  <!-- opened inside Facebook / Instagram / LINE / Messenger: their built-in browsers play the game poorly, so send the
       player to the real browser (Android: Chrome by intent; LINE: its own switch; iPhone: Safari's scheme, with how to
       do it by hand if that's refused) -->
  <div id="outside">
    <b>🐻</b>
    <div>在 Facebook／LINE 裡面開的網頁，遊戲可能跑不順</div>
    <a id="outside-go" href="#">用瀏覽器開啟</a>
    <div class="small">如果按了沒反應：點右上角「⋯」或「分享」→「在外部瀏覽器開啟」</div>
    <button id="outside-stay" type="button">留在這裡玩</button>
  </div>
  <script>
    (function () {
      var ua = navigator.userAgent;
      if (!/FBAN|FBAV|FB_IAB|FBIOS|Instagram|Line\/|Messenger|MicroMessenger/i.test(ua)) return;
      var here = location.href.split("#")[0];
      var bare = here.replace(/^https?:\/\//, "");
      var android = /Android/i.test(ua), apple = /iPhone|iPad|iPod/i.test(ua);
      var chrome = "intent://" + bare + "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" + encodeURIComponent(here) + ";end";
      if (/Line\//i.test(ua) && here.indexOf("openExternalBrowser") < 0) {
        location.replace(here + (here.indexOf("?") < 0 ? "?" : "&") + "openExternalBrowser=1");
      } else if (android) {
        location.href = chrome;
      }
      var card = document.getElementById("outside");
      card.style.display = "flex";
      document.getElementById("outside-go").href = android ? chrome : apple ? "x-safari-" + here : here;
      document.getElementById("outside-stay").onclick = function () { card.style.display = "none"; };
    })();
  </script>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="turn"><b>↻</b>請把手機橫過來玩</div>
  <div id="loading"><h1>黑熊大冒險</h1><div id="bar"><div id="fill"></div></div><div id="pct">0%</div><div id="note">載入中…（第一次比較久）</div></div>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var config = {
      dataUrl: "Build/530a7d8e06acd13a321bf5aa45ea6aed.data.unityweb",
      frameworkUrl: "Build/e5cc34aab0c89775c3e8e266b31c767a.framework.js.unityweb",
      codeUrl: "Build/bafda55a09124978dde8b62adfa2d94c.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "BearGalaxy",
      productName: "黑熊大冒險",
      productVersion: "0.1.0",
      devicePixelRatio: Math.max(1, Math.min(2, Math.floor(window.devicePixelRatio || 1))), // whole numbers only (at 1.5, a laptop at 150 % or many phones, Unity draws the picture too big and off-centre), and at most 2, which a phone keeps up with
    };
    var script = document.createElement("script");
    script.src = "Build/dc4b4355f8a028228060a363c6889c24.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) { document.querySelector("#fill").style.width = (100 * p) + "%"; document.querySelector("#pct").textContent = Math.floor(100 * p) + "%"; })
        .then(function (game) {
          document.querySelector("#loading").remove(); canvas.focus();
          if (phoneOS && !asApp) game.SendMessage("Touch controls", "SetPhone", phoneOS);
          // every finger on the canvas goes to the game's touch controls as well: some phone browsers never hand
          // touches to Unity's own input (the game sat on its title, deaf to taps)
          function forward(phase) {
            return function (e) {
              var r = canvas.getBoundingClientRect();
              for (var i = 0; i < e.changedTouches.length; i++) {
                var t = e.changedTouches[i];
                var x = (t.clientX - r.left) * canvas.width / r.width, y = (r.bottom - t.clientY) * canvas.height / r.height;
                game.SendMessage("Touch controls", "PageTouch", phase + " " + (t.identifier % 100000) + " " + x.toFixed(1) + " " + y.toFixed(1));
              }
            };
          }
          canvas.addEventListener("touchstart", forward("start"), { passive: true });
          canvas.addEventListener("touchmove", forward("move"), { passive: true });
          canvas.addEventListener("touchend", forward("end"), { passive: true });
          canvas.addEventListener("touchcancel", forward("end"), { passive: true });
        })
        .catch(function (e) { document.querySelector("#note").textContent = "載入失敗：" + e; });
    };
    document.body.appendChild(script);
    canvas.addEventListener("click", function () { canvas.focus(); });
    canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    // on a phone the first touch also takes the whole screen, sideways (where a page may: Android; an iPhone only
    // does that for a page opened from the home screen, so the loading card says how)
    canvas.addEventListener("touchend", function () {
      var el = document.documentElement;
      if (document.fullscreenElement || !el.requestFullscreen) return;
      el.requestFullscreen({ navigationUI: "hide" }).then(function () {
        if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {});
      }).catch(function () {});
    }, { once: true, passive: true });
    // on a phone, not yet opened from the home screen: how to add it there, step by step, to play full screen like an app
    var phoneOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ? "ios" : /Android/.test(navigator.userAgent) ? "android" : "";
    var asApp = navigator.standalone || matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches;
    (function () {
      if (!phoneOS || asApp) return;
      var steps = phoneOS == "ios"
        ? ["點畫面下方的「分享」按鈕（方框加向上的箭頭）", "往下滑，點「加入主畫面」", "點右上角「新增」"]
        : ["點右上角的「⋮」", "點「加到主畫面」（有些手機叫「安裝應用程式」）", "點「新增」或「安裝」"];
      var html = "<div class=\"tip\"><b>像 App 一樣全螢幕玩：加入主畫面</b>";
      for (var i = 0; i < steps.length; i++) html += "<div>" + (i + 1) + ". " + steps[i] + "</div>";
      html += "<div>之後從主畫面的黑熊圖示打開就好！</div></div>";
      document.querySelector("#note").innerHTML += html;
    })();
  </script>
  <!-- the win card's "分享成績": HTML, so the phone's share sheet opens straight from the tap (WebShare.cs shows and hides it) -->
  <button id="share" type="button">分享成績</button>
  <div id="toast"></div>
  <script>
    window.bgShare = (function () {
      var button = document.getElementById("share"), toast = document.getElementById("toast"), text = "";
      var url = "https://sonia6891.github.io/bear-galaxy/";
      function say(s) { toast.textContent = s; toast.style.display = "block"; setTimeout(function () { toast.style.display = "none"; }, 3500); }
      button.onclick = function () {
        if (navigator.share) { navigator.share({ title: "黑熊大冒險", text: text, url: url }).catch(function () {}); return; }
        // no share sheet (a computer): copy the result, then open Facebook's share box for the link
        var all = text + " " + url;
        if (navigator.clipboard) navigator.clipboard.writeText(all).then(function () { say("成績已複製，貼到 Facebook 的貼文裡吧！"); }, function () {});
        window.open("https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(url), "_blank");
      };
      return {
        show: function (t) { text = t; button.style.display = "block"; },
        hide: function () { button.style.display = "none"; }
      };
    })();
  </script>
</body>
</html>
