<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>黑熊大冒險</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0d0f26; }
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; /* the visible window, also on a phone whose bars come and go */ background: #0d0f26; outline: none;
      touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; } /* fingers play, they don't scroll or zoom */
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #ffe8a8; font-family: "Noto Serif TC", "PingFang TC", "Microsoft JhengHei", serif; gap: 18px; }
    #loading h1 { margin: 0; font-size: clamp(24px, 4vw, 44px); letter-spacing: .08em; text-shadow: 0 3px 10px #000; }
    #bar { width: min(420px, 70vw); height: 12px; border-radius: 6px; background: #2a2d55; overflow: hidden; border: 1px solid #c9a24a; }
    #fill { width: 0; height: 100%; background: linear-gradient(90deg, #ffd25a, #ff9d5a); }
    #note { font-size: 14px; color: #b9bde0; }
    /* a phone held upright: ask for it sideways (the game is laid out for a wide screen) */
    #turn { display: none; position: fixed; inset: 0; z-index: 10; background: rgba(13, 15, 38, .94); color: #ffe8a8;
      font-family: "Noto Serif TC", "PingFang TC", "Microsoft JhengHei", serif; font-size: 22px; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; text-align: center; }
    #turn b { font-size: 54px; }
    @media (orientation: portrait) and (pointer: coarse) { #turn { display: flex; } }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="turn"><b>↻</b>請把手機橫過來玩</div>
  <div id="loading"><h1>黑熊大冒險</h1><div id="bar"><div id="fill"></div></div><div id="note">載入中…（第一次比較久）</div></div>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var config = {
      dataUrl: "Build/Build-Web.data.unityweb",
      frameworkUrl: "Build/Build-Web.framework.js.unityweb",
      codeUrl: "Build/Build-Web.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "BearGalaxy",
      productName: "黑熊大冒險",
      productVersion: "0.1.0",
      devicePixelRatio: Math.max(1, Math.min(2, Math.floor(window.devicePixelRatio || 1))), // whole numbers only (at 1.5, a laptop at 150 % or many phones, Unity draws the picture too big and off-centre), and at most 2, which a phone keeps up with
    };
    var script = document.createElement("script");
    script.src = "Build/Build-Web.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) { document.querySelector("#fill").style.width = (100 * p) + "%"; })
        .then(function () { document.querySelector("#loading").remove(); canvas.focus(); })
        .catch(function (e) { document.querySelector("#note").textContent = "載入失敗：" + e; });
    };
    document.body.appendChild(script);
    canvas.addEventListener("click", function () { canvas.focus(); });
    canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  </script>
</body>
</html>
