<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- added to a phone's home screen it opens on the whole screen, like an app (the only way on an iPhone) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="黑熊大冒險">
  <meta name="theme-color" content="#0d0f26">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>黑熊大冒險</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0d0f26; }
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; /* the visible window, also on a phone whose bars come and go */ background: #0d0f26; outline: none;
      touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; } /* fingers play, they don't scroll or zoom */
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #ffe8a8; font-family: "Noto Serif TC", "PingFang TC", "Microsoft JhengHei", serif; gap: 18px; }
    #loading h1 { margin: 0; font-size: clamp(24px, 4vw, 44px); letter-spacing: .08em; text-shadow: 0 3px 10px #000; }
    #bar { width: min(420px, 70vw); height: 12px; border-radius: 6px; background: #2a2d55; overflow: hidden; border: 1px solid #c9a24a; }
    #fill { width: 0; height: 100%; background: linear-gradient(90deg, #ffd25a, #ff9d5a); }
    #note { font-size: 14px; color: #b9bde0; }
    /* a phone held upright: ask for it sideways (the game is laid out for a wide screen) */
    #turn { display: none; position: fixed; inset: 0; z-index: 10; background: rgba(13, 15, 38, .94); color: #ffe8a8;
      font-family: "Noto Serif TC", "PingFang TC", "Microsoft JhengHei", serif; font-size: 22px; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; text-align: center; }
    #turn b { font-size: 54px; }
    @media (orientation: portrait) and (pointer: coarse) { #turn { display: flex; } }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="turn"><b>↻</b>請把手機橫過來玩</div>
  <div id="loading"><h1>黑熊大冒險</h1><div id="bar"><div id="fill"></div></div><div id="note">載入中…（第一次比較久）</div></div>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var config = {
      dataUrl: "Build/Build-Web.data.unityweb",
      frameworkUrl: "Build/Build-Web.framework.js.unityweb",
      codeUrl: "Build/Build-Web.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "BearGalaxy",
      productName: "黑熊大冒險",
      productVersion: "0.1.0",
      devicePixelRatio: Math.max(1, Math.min(2, Math.floor(window.devicePixelRatio || 1))), // whole numbers only (at 1.5, a laptop at 150 % or many phones, Unity draws the picture too big and off-centre), and at most 2, which a phone keeps up with
    };
    var script = document.createElement("script");
    script.src = "Build/Build-Web.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) { document.querySelector("#fill").style.width = (100 * p) + "%"; })
        .then(function (game) {
          document.querySelector("#loading").remove(); canvas.focus();
          // every finger on the canvas goes to the game's touch controls as well: some phone browsers never hand
          // touches to Unity's own input (the game sat on its title, deaf to taps)
          function forward(phase) {
            return function (e) {
              var r = canvas.getBoundingClientRect();
              for (var i = 0; i < e.changedTouches.length; i++) {
                var t = e.changedTouches[i];
                var x = (t.clientX - r.left) * canvas.width / r.width, y = (r.bottom - t.clientY) * canvas.height / r.height;
                game.SendMessage("Touch controls", "PageTouch", phase + " " + (t.identifier % 100000) + " " + x.toFixed(1) + " " + y.toFixed(1));
              }
            };
          }
          canvas.addEventListener("touchstart", forward("start"), { passive: true });
          canvas.addEventListener("touchmove", forward("move"), { passive: true });
          canvas.addEventListener("touchend", forward("end"), { passive: true });
          canvas.addEventListener("touchcancel", forward("end"), { passive: true });
        })
        .catch(function (e) { document.querySelector("#note").textContent = "載入失敗：" + e; });
    };
    document.body.appendChild(script);
    canvas.addEventListener("click", function () { canvas.focus(); });
    canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    // on a phone the first touch also takes the whole screen, sideways (where a page may: Android; an iPhone only
    // does that for a page opened from the home screen, so the loading card says how)
    canvas.addEventListener("touchend", function () {
      var el = document.documentElement;
      if (document.fullscreenElement || !el.requestFullscreen) return;
      el.requestFullscreen({ navigationUI: "hide" }).then(function () {
        if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {});
      }).catch(function () {});
    }, { once: true, passive: true });
    if (/iPhone|iPod/.test(navigator.userAgent) && !navigator.standalone)
      document.querySelector("#note").innerHTML += "<br>想全螢幕玩：按「分享」→「加入主畫面」，再從主畫面的黑熊圖示打開";
  </script>
</body>
</html>
